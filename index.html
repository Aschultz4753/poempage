<h1 style="color: #DBC7BE; text-align: center;font-family: monospace;">I Have No Life But This</h1>
<h2 style="color: #DBC7BE; text-align: center;font-family: monospace;">By Emily Dickinson</h2>

<p style="color: #DBC7BE; text-align: center;font-family: monospace;"> I have no life but this,<br/>To lead it here;<br/>Nor any death, but lest<br/> Dispelled from there;</p>
<p style="color: #DBC7BE; text-align: center;font-family: monospace;"> Nor tie to earths to come,<br/> Nor action new,<br/> Except through this extent,<br/> The realm of you.</p>
